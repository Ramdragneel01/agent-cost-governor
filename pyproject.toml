[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-cost-governor"
version = "0.1.0"
description = "FinOps proxy for LLM APIs: per-tenant token budgets, auto-downgrade routing, and alerts."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Ram Prakash Dhulipudi" }]
keywords = ["llm", "finops", "cost", "rate-limit", "openai", "anthropic", "ai-ops"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "structlog>=24.4",
]

[project.urls]
Homepage = "https://github.com/Ramdragneel01/agent-cost-governor"
Repository = "https://github.com/Ramdragneel01/agent-cost-governor"
Issues = "https://github.com/Ramdragneel01/agent-cost-governor/issues"

[project.scripts]
agent-cost-governor = "agent_cost_governor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
